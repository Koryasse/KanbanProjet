<VirtualHost *:80>
    ServerName app.local
    DocumentRoot /var/www/html/collection-app/public
    <Directory /var/www/html/collection-app/public>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/app-error.log
    CustomLog ${APACHE_LOG_DIR}/app-access.log combined
</VirtualHost>